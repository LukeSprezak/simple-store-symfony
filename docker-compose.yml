services:
  mysql:
    image: mysql:8.4.11
    container_name: mysql
    volumes:
      - ./etc/docker/sql/images:/sql_images
      - ./etc/docker/sql/init:/docker-entrypoint-initdb.d:ro
      - mysql_storage:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=dbname
      - MYSQL_USER=app
      - MYSQL_PASSWORD=app
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:13306:3306"
    networks:
      - app

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    working_dir: /var/www
    restart: always
    volumes:
      - .:/var/www
      - ./etc/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - app

  php85:
    build:
      context: .
      dockerfile: ./etc/docker/php-fpm/Dockerfile
    container_name: php85
    working_dir: /var/www
    environment:
      XDEBUG_CLIENT_HOST: host.docker.internal
      XDEBUG_CLIENT_PORT: 9003
      PHP_IDE_CONFIG: serverName=Docker
    volumes:
      - .:/var/www
      - ./etc/docker/php-fpm/php.ini:/usr/local/etc/php/conf.d/99-overrides.ini
      - ./etc/docker/php-fpm/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    volumes:
      - /sessions
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8883:80"
    networks:
      - app

  redis:
    image: redis:8.10.2-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app

  rabbit:
    image: rabbitmq:4.3.6-management
    container_name: rabbitmq
    hostname: rabbit
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - '127.0.0.1:15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: 'user'
      RABBITMQ_DEFAULT_PASS: 'password'
    volumes:
      - rabbitmq_storage:/var/lib/rabbitmq
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  mysql_storage:
  rabbitmq_storage:
