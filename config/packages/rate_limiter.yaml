framework:
  rate_limiter:
    anonymous_api:
      policy: 'fixed_window'
      limit: 5
      interval: '1 minute'
    authenticated_api:
      policy: 'fixed_window'
      limit: 60
      interval: '1 minute'
when@test:
  framework:
    rate_limiter:
      anonymous_api:
        policy: 'fixed_window'
        limit: 5
        interval: '10 seconds'
      authenticated_api:
        policy: 'fixed_window'
        limit: 5
        interval: '10 seconds'
