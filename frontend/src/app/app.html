@if (auth.isAdmin()) {
  <div class="staff-bar">Staff panel</div>
}
<header class="header" [class.staff]="auth.isAdmin()">
  <a class="logo" routerLink="/">
    <span class="logo-mark"></span>
    Example Shop
  </a>
  @if (auth.token()) {
    <nav class="menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Products</a>
      <a routerLink="/cart" routerLinkActive="active">
        Cart
        @if (cart.itemCount()) {
          <span class="badge">{{ cart.itemCount() }}</span>
        }
      </a>
      <a routerLink="/orders" routerLinkActive="active">Orders</a>
    </nav>
    @if (auth.isAdmin()) {
      <span class="staff-user">
        <span class="staff-tag">Staff</span>
        {{ auth.email() }}
      </span>
    }
    <button class="btn" type="button" (click)="logout()">Log out</button>
  }
</header>
<router-outlet />
