<main class="container">
  <form class="panel" (ngSubmit)="submit()">
    <h1>Log in</h1>
    <label class="field">
      Email
      <input name="email" type="email" [(ngModel)]="email" required />
    </label>
    <label class="field">
      Password
      <input name="password" type="password" [(ngModel)]="password" required />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button class="btn btn-primary" type="submit">
      <span class="material-symbols-rounded" aria-hidden="true">login</span>
      Log in
    </button>
  </form>
</main>
