deptrac:
  paths:
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/[^/]+/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/[^/]+/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/[^/]+/Infrastructure/.*
    - name: UI
      collectors:
        - type: directory
          value: src/[^/]+/UI/.*
  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
    UI:
      - Domain
      - Application
      - Infrastructure
